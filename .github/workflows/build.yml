name: Build and Publish NuGet

on:
  push:
    branches:
      - release
jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: '7.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    - name: Pack
      run: dotnet pack --configuration Release

    - name: Add private GitHub registry to NuGet
      run: nuget sources add -n "GPR" --source https://nuget.pkg.github.com/0xbadjuju/index.json -u 0xbadjuju -p ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text
        
    - name: Push generated package to GitHub registry
      run: nuget push ./bin/Release/*.nupkg -s "GPR" --skip-duplicate -n

    - name: Publish NuGet
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        files: ./bin/Release/*.nupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
